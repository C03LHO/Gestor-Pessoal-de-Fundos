services:
  fundos:
    container_name: fundos
    build:
      context: .
      dockerfile: Dockerfile
    image: fundos:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}
      DATABASE_URL: file:/app/data/data.db
      TZ: America/Sao_Paulo
    volumes:
      - fundos_data:/app/data
    healthcheck:
      # Usa node fetch (built-in no Node 20) — evita problemas de wget+IPv6+busybox.
      # 127.0.0.1 explícito força IPv4. start_period generoso para o primeiro boot.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s

volumes:
  fundos_data:
