services:
  fundos:
    container_name: fundos
    build:
      context: .
      dockerfile: Dockerfile
    image: fundos:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}
      DATABASE_URL: file:/app/data/data.db
      TZ: America/Sao_Paulo
    volumes:
      - fundos_data:/app/data
    healthcheck:
      # wget --spider só faz HEAD/GET sem baixar corpo, mais leve.
      # start_period generoso: primeira inicialização inclui prisma db push.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 90s

volumes:
  fundos_data:
