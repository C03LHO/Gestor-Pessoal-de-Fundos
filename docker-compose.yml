services:
  fundos:
    container_name: fundos
    build:
      context: .
      dockerfile: Dockerfile
    image: fundos:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}
      DATABASE_URL: file:/app/data/data.db
      TZ: America/Sao_Paulo
    volumes:
      - fundos_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  fundos_data:
